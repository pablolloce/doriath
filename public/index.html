<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doriath</title>
  <link rel="icon" href="/brand/nfq-isotype.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar bbva-combo--electric" id="sidebar">
      <div class="sidebar__brand">
        <img src="/brand/bbva-white.png" alt="BBVA" class="sidebar__bbva">
        <div class="sidebar__product">
          <span class="sidebar__kicker">NFQ · BBVA CIB</span>
          <span class="sidebar__name">Doriath</span>
        </div>
      </div>
      <nav class="sidebar__nav" id="nav">
        <a class="navlink" href="#/knowledge" data-route="knowledge">
          <span class="navlink__index">01</span>
          <span class="navlink__label">Knowledge Base Studio</span>
          <span class="navlink__hint">Documentos y specs</span>
        </a>
        <a class="navlink" href="#/assistant" data-route="assistant">
          <span class="navlink__index">02</span>
          <span class="navlink__label">BBVA CIB Assistant</span>
          <span class="navlink__hint">Conversación y entregables</span>
        </a>
        <a class="navlink" href="#/work" data-route="work">
          <span class="navlink__index">03</span>
          <span class="navlink__label">Knowledge-Driven Development</span>
          <span class="navlink__hint">Iniciativas, repositorios y cambios</span>
        </a>
      </nav>
      <div class="sidebar__sources">
        <div class="sidebar__section-title">
          <span>Bases de conocimiento</span>
          <button class="btn btn--ghost btn--xs" id="btnManageSources" title="Gestionar bases de conocimiento">Gestionar</button>
        </div>
        <div id="sourceMenu" class="source-menu"></div>
      </div>
      <div class="sidebar__footer">
        <div class="session" id="sessionBadge"></div>
        <div class="nfq-credit"><span class="nfq-credit__label">Hecho por</span><img src="/brand/nfq-white.png" alt="NFQ" class="nfq-logo"></div>
      </div>
    </aside>
    <main class="main" id="main">
      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb"><span>DORIATH</span></div>
        <div class="topbar__actions">
          <div class="model-picker" id="modelPicker"></div>
          <button class="btn btn--ghost btn--sm" id="btnSettings">Ajustes</button>
          <img src="/brand/bbva-electric.png" alt="BBVA" class="topbar__logo">
        </div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toasts" class="toasts"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
