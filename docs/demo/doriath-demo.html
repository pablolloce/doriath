.bento{display:grid;gap:var(--space-2)} .bento--2{grid-template-columns:repeat(2,minmax(0,1fr))} .bento--3{grid-template-columns:repeat(3,minmax(0,1fr))} .bento--4{grid-template-columns:repeat(4,minmax(0,1fr))}
