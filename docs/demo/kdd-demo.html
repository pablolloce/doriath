<html lang="es">
<head>

<title>KDD Studio · maqueta interactiva</title>
<style>
/* Tokens de la identidad BBVA × NFQ (copiados de public/styles.css; sin fuentes externas) */
:root {
  --bbva-electric-blue:#001391; --bbva-serene-blue:#85C8FF; --bbva-white:#FFFFFF; --bbva-sand:#F7F8F8;
  --bbva-gray-2:#E2E6EA; --bbva-gray-3:#CAD1D8; --bbva-gray-4:#ADB8C2; --bbva-gray-5:#46536D;
  --bbva-midnight:#070E46; --bbva-deep:#000519; --bbva-canary:#FFE761; --bbva-lime:#88E783;
  --bbva-ice:#8BE1E9; --bbva-purple:#9694FF; --bbva-mandarin:#FFB56B;
  --bbva-font-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --bbva-font-body:"Lato","Helvetica Neue",Arial,sans-serif;
  --font-mono:Consolas,"Cascadia Mono","SF Mono",Menlo,monospace;
  --space-1:8px; --space-2:16px; --space-3:24px; --space-4:32px; --space-5:40px;
  --radius-sm:8px; --radius-md:16px; --radius-lg:24px; --radius-full:9999px;
  --shadow-card:0 4px 16px rgba(0,19,145,.06); --sidebar-width:296px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0;height:100%}
body{font-family:var(--bbva-font-body);font-size:15px;line-height:1.5;color:var(--bbva-midnight);background:var(--bbva-sand)}
h1,h2,h3,h4{font-family:var(--bbva-font-display);font-weight:700;margin:0;color:var(--bbva-electric-blue)}
h1{font-size:34px;line-height:1.05} h2{font-size:24px;line-height:1.1} h3{font-size:19px;line-height:1.15} h4{font-size:16px}
p{margin:0} a{color:var(--bbva-electric-blue)} button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
code,pre{font-family:var(--font-mono);font-size:13px} [hidden]{display:none!important}
.bbva-combo--electric{background:var(--bbva-electric-blue);color:var(--bbva-sand)}
.app{display:grid;grid-template-columns:var(--sidebar-width) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:var(--space-3);gap:var(--space-3);overflow-y:auto}
.sidebar__brand{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:var(--space-1) 0 var(--space-2);border-bottom:1px solid rgba(247,248,248,.18)}
.sidebar__identity{display:flex;align-items:center;gap:12px}
.sidebar__mark{width:44px;height:44px;flex-shrink:0}
.gate__mark{width:72px;height:72px}
.wordmark{font-family:var(--bbva-font-body);font-weight:700;letter-spacing:.12em;font-size:18px;color:#fff}
.wordmark--electric{color:var(--bbva-electric-blue);font-size:16px}
.sidebar__product{display:flex;flex-direction:column;line-height:1.1}
.sidebar__kicker{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bbva-serene-blue)}
.sidebar__name{font-family:var(--bbva-font-display);font-weight:700;font-size:22px;color:var(--bbva-sand)}
.sidebar__nav{display:flex;flex-direction:column;gap:var(--space-1)}
.navlink{display:grid;grid-template-columns:32px 1fr;grid-template-rows:auto auto;column-gap:var(--space-1);padding:12px 14px;border-radius:var(--radius-md);text-decoration:none;color:var(--bbva-sand);transition:background 120ms ease;cursor:pointer}
.navlink:hover{background:rgba(247,248,248,.08)} .navlink.is-active{background:var(--bbva-serene-blue);color:var(--bbva-electric-blue)}
.navlink__index{grid-row:1/span 2;font-family:var(--bbva-font-display);font-size:20px;font-weight:700;opacity:.8}
.navlink__label{font-weight:700;font-size:14px} .navlink__hint{font-size:12px;opacity:.75}
.sidebar__sources{flex:1;display:flex;flex-direction:column;gap:var(--space-1);min-height:0}
.sidebar__section-title{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bbva-serene-blue)}
.source-menu{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.source-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;color:var(--bbva-sand);background:rgba(247,248,248,.06)}
.source-item:hover{background:rgba(247,248,248,.12)} .source-item.is-active{background:var(--bbva-sand);color:var(--bbva-electric-blue)}
.source-item__dot{width:10px;height:10px;border-radius:50%;background:var(--bbva-lime);flex-shrink:0} .source-item.is-missing .source-item__dot{background:var(--bbva-mandarin)}
.source-item__name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .source-item__meta{font-size:11px;opacity:.75}
.sidebar__footer{display:flex;flex-direction:column;gap:var(--space-2);padding-top:var(--space-2);border-top:1px solid rgba(247,248,248,.18)}
.session{display:flex;align-items:center;gap:10px;font-size:12px}
.session__avatar{width:32px;height:32px;border-radius:50%;background:var(--bbva-serene-blue);color:var(--bbva-electric-blue);display:grid;place-items:center;font-weight:700}
.session__name{font-weight:700} .session__state{opacity:.75}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px var(--space-4);background:rgba(247,248,248,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--bbva-gray-2)}

.view{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--radius-full);border:1px solid var(--bbva-electric-blue);background:var(--bbva-electric-blue);color:var(--bbva-white);font-weight:700;font-size:14px;line-height:1.2;cursor:pointer;transition:transform 120ms ease;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn--accent{background:var(--bbva-serene-blue);border-color:var(--bbva-serene-blue);color:var(--bbva-electric-blue)}
.btn--lime{background:var(--bbva-lime);border-color:var(--bbva-lime);color:var(--bbva-electric-blue)}
.btn--outline{background:transparent;color:var(--bbva-electric-blue)} .btn--ghost{background:transparent;border-color:transparent;color:inherit}
.btn--danger{background:transparent;border-color:var(--bbva-mandarin);color:var(--bbva-midnight)}
.btn--sm{padding:7px 14px;font-size:13px} .btn--xs{padding:4px 10px;font-size:11px} .sidebar .btn--ghost{color:var(--bbva-serene-blue)}
.card{background:var(--bbva-white);border-radius:var(--radius-lg);padding:var(--space-3);box-shadow:var(--shadow-card)}
.card--sand{background:var(--bbva-sand);box-shadow:none;border:1px solid var(--bbva-gray-2)}
.card--serene{background:var(--bbva-serene-blue);color:var(--bbva-electric-blue);box-shadow:none}
.card--electric{background:var(--bbva-electric-blue);color:var(--bbva-sand);box-shadow:none} .card--electric h1,.card--electric h2,.card--electric h3{color:var(--bbva-sand)}
.card--canary{background:var(--bbva-canary);color:var(--bbva-electric-blue);box-shadow:none} .card--lime{background:var(--bbva-lime);color:var(--bbva-electric-blue);box-shadow:none}
.card--ice{background:var(--bbva-ice);color:var(--bbva-electric-blue);box-shadow:none}
.card__header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-2)} .card__actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bento{display:grid;gap:var(--space-2)} .bento--2{grid-template-columns:repeat(2,minmax(0,1fr))} .bento--3{grid-template-columns:repeat(3,minmax(0,1fr))} .bento--4{grid-template-columns:repeat(4,minmax(0,1fr))}
.bento--main-aside{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)} .bento--aside-main{grid-template-columns:minmax(260px,1fr) minmax(0,2.4fr)}
@media (max-width:1100px){.bento--3,.bento--4{grid-template-columns:repeat(2,minmax(0,1fr))}.bento--main-aside,.bento--aside-main{grid-template-columns:1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}}
.ante-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bbva-gray-5);margin-bottom:6px} .card--electric .ante-title,.card--serene .ante-title{color:inherit;opacity:.8}
.lead{font-size:17px;line-height:1.5;max-width:70ch} .muted{color:var(--bbva-gray-5)} .small{font-size:13px}
.stat{display:flex;flex-direction:column;gap:2px} .stat__value{font-family:var(--bbva-font-display);font-size:40px;font-weight:700;line-height:1} .stat__label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.8}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-full);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--bbva-gray-2);color:var(--bbva-electric-blue);white-space:nowrap}
.chip--serene{background:var(--bbva-serene-blue)} .chip--lime{background:var(--bbva-lime)} .chip--canary{background:var(--bbva-canary)} .chip--mandarin{background:var(--bbva-mandarin)} .chip--purple{background:var(--bbva-purple)} .chip--ice{background:var(--bbva-ice)}
.chip--outline{background:transparent;border:1px solid var(--bbva-gray-3);color:var(--bbva-gray-5)} .chips{display:flex;gap:6px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px} .field label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--bbva-gray-5)}
.input,.select,.textarea{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--bbva-gray-3);background:var(--bbva-white);color:var(--bbva-midnight);outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--bbva-electric-blue);box-shadow:0 0 0 3px rgba(133,200,255,.4)} .textarea{min-height:96px;resize:vertical;line-height:1.5}
.form-row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:flex-end} .form-row .field{flex:1;min-width:180px}
.checkbox{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer} .checkbox input{width:16px;height:16px;accent-color:var(--bbva-electric-blue)}
.table{width:100%;border-collapse:collapse;font-size:14px} .table th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--bbva-electric-blue);background:var(--bbva-gray-2)}
.table th:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)} .table th:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.table td{padding:10px 12px;border-bottom:1px solid var(--bbva-gray-2);vertical-align:top} .table tr.is-clickable{cursor:pointer} .table tr.is-clickable:hover td{background:rgba(133,200,255,.18)} .table tr.is-selected td{background:rgba(133,200,255,.35)}
.table--compact td,.table--compact th{padding:6px 8px} .mono{font-family:var(--font-mono);font-size:12.5px}
.table .mono{white-space:nowrap}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--bbva-sand);border:1px solid var(--bbva-gray-2)}
.list-item.is-clickable{cursor:pointer} .list-item.is-clickable:hover{border-color:var(--bbva-serene-blue)} .list-item.is-active{background:var(--bbva-serene-blue);border-color:var(--bbva-serene-blue);color:var(--bbva-electric-blue)}
.list-item__main{min-width:0;display:flex;flex-direction:column;gap:2px} .list-item__title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .list-item__meta{font-size:12px;opacity:.75}
.empty{padding:var(--space-4);text-align:center;color:var(--bbva-gray-5);border:1px dashed var(--bbva-gray-3);border-radius:var(--radius-md)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bbva-gray-2);padding-bottom:8px}
.tab{padding:8px 14px;border-radius:var(--radius-full);border:0;background:transparent;color:var(--bbva-gray-5);font-weight:700;cursor:pointer} .tab.is-active{background:var(--bbva-electric-blue);color:var(--bbva-white)}
.progress{height:8px;border-radius:var(--radius-full);background:var(--bbva-gray-2);overflow:hidden} .progress__bar{height:100%;background:var(--bbva-serene-blue);transition:width 300ms ease}
.log{background:var(--bbva-midnight);color:var(--bbva-sand);border-radius:var(--radius-md);padding:14px 16px;font-family:var(--font-mono);font-size:12px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log__time{color:var(--bbva-serene-blue);margin-right:8px}
.diff{font-family:var(--font-mono);font-size:12px;white-space:pre;overflow:auto;max-height:420px;background:var(--bbva-white);border:1px solid var(--bbva-gray-2);border-radius:var(--radius-md);padding:12px}
.diff .add{background:rgba(136,231,131,.35)} .diff .del{background:rgba(255,181,107,.35)} .diff .hunk{color:var(--bbva-purple)} .diff .file{font-weight:700;color:var(--bbva-electric-blue);background:var(--bbva-gray-2)}
.callout{padding:14px 18px;border-radius:var(--radius-md);background:var(--bbva-serene-blue);color:var(--bbva-electric-blue)} .callout--warn{background:var(--bbva-canary)} .callout--ok{background:var(--bbva-lime)} .callout--info{background:var(--bbva-ice)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:13px} .kv dt{color:var(--bbva-gray-5);text-transform:uppercase;font-size:11px;letter-spacing:.04em;font-weight:700} .kv dd{margin:0}
.md{line-height:1.6;overflow-wrap:anywhere} .md h2{font-size:20px;margin:14px 0 8px} .md h3{font-size:16px;margin:12px 0 6px} .md p{margin:0 0 10px} .md ul,.md ol{margin:0 0 10px;padding-left:22px} .md li{margin:3px 0}

.md pre{background:var(--bbva-midnight);color:var(--bbva-sand);padding:12px 14px;border-radius:var(--radius-sm);overflow:auto} .md pre code{background:transparent;color:inherit}
.chat{display:grid;grid-template-rows:auto 1fr auto;min-height:calc(100vh - 220px)}
.chat__thread{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-2) 0;overflow-y:auto}
.msg{max-width:860px;padding:14px 18px;border-radius:var(--radius-md)}
.msg--user{align-self:flex-end;background:var(--bbva-electric-blue);color:var(--bbva-sand);border-bottom-right-radius:4px} .msg--user .msg__meta{color:var(--bbva-serene-blue)}

@keyframes blink{from{opacity:.3}to{opacity:1}}

.composer textarea{border:0;resize:none;min-height:64px;max-height:240px;outline:none;padding:6px 4px;width:100%} .composer__bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.file-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-full);background:var(--bbva-gray-2);font-size:12px;cursor:pointer}

.model-picker select{padding:6px 10px;border-radius:var(--radius-full);border:1px solid var(--bbva-gray-3);background:var(--bbva-white);font-size:13px}

.rolepick button.is-active{background:var(--bbva-electric-blue);color:#fff}

.bar-row b{text-align:right;font-variant-numeric:tabular-nums}
.health{display:flex;align-items:baseline;gap:10px}
.health__score{font-family:var(--bbva-font-display);font-size:52px;font-weight:700;line-height:1}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:22px 1fr;gap:12px}
.tl__rail{display:flex;flex-direction:column;align-items:center}
.tl__dot{width:11px;height:11px;border-radius:50%;background:var(--bbva-serene-blue);margin-top:5px;flex-shrink:0}
.tl__dot.is-chat{background:var(--bbva-canary)} .tl__dot.is-import{background:var(--bbva-lime)} .tl__dot.is-edit{background:var(--bbva-purple)} .tl__dot.is-gov{background:var(--bbva-mandarin)}
.tl__line{flex:1;width:2px;background:var(--bbva-gray-2);margin:4px 0 0}
.tl__body{padding-bottom:16px;min-width:0}
.tl__meta{font-size:12px;color:var(--bbva-gray-5)}
.dropzone{border:2px dashed var(--bbva-gray-3);border-radius:var(--radius-md);padding:var(--space-4);text-align:center;background:var(--bbva-white);cursor:pointer}
.dropzone:hover{border-color:var(--bbva-serene-blue);background:rgba(133,200,255,.08)}
.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step__n{width:26px;height:26px;border-radius:50%;background:var(--bbva-electric-blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.learned{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bbva-gray-2);font-size:14px}
.learned:last-child{border-bottom:0}
.learned__tick{color:var(--bbva-electric-blue);font-weight:700}
.answer-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.avatar-sm{width:26px;height:26px;border-radius:50%;background:var(--bbva-serene-blue);color:var(--bbva-electric-blue);display:grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0}
.kb-picker__label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bbva-gray-5);margin-bottom:8px}
.kb-picker{display:flex;gap:10px;flex-wrap:wrap}
.kb-chip{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;font-family:inherit;padding:12px 16px;min-width:190px;border-radius:var(--radius-md);border:1px solid var(--bbva-gray-2);background:var(--bbva-white);color:var(--bbva-midnight);cursor:pointer;transition:border-color 120ms ease,transform 120ms ease}
.kb-chip:hover{border-color:var(--bbva-serene-blue);transform:translateY(-1px)}
.kb-chip.is-active{background:var(--bbva-electric-blue);border-color:var(--bbva-electric-blue);color:var(--bbva-sand)}
.kb-chip.is-missing{opacity:.6;cursor:not-allowed}
.kb-chip__name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.kb-chip__meta{font-size:12px;opacity:.75}
.kb-chip__dot{width:8px;height:8px;border-radius:50%;background:var(--bbva-lime);flex-shrink:0}
.kb-chip.is-missing .kb-chip__dot{background:var(--bbva-mandarin)}
.kb-chip--add{border-style:dashed;align-items:center;justify-content:center;min-width:150px;color:var(--bbva-gray-5);font-weight:700}
</style>
</head>

function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value == null) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key === "html") node.innerHTML = value;
    else if (key === "style" && typeof value === "object") Object.assign(node.style, value);
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "disabled" || key === "checked" || key === "selected") node[key] = !!value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat(Infinity)) if (child != null) node.append(child.nodeType ? child : document.createTextNode(String(child)));
  return node;
}

const modalStack = [];
function openModal({ wide } = {}) {
  const overlay = $("overlay"); overlay.hidden = false;
  const modal = h("div", { class: `modal${wide ? " modal--wide" : ""}` });
  for (const child of overlay.children) child.hidden = true;
  overlay.append(modal); modalStack.push(modal);
  const close = () => {
    if (!modalStack.includes(modal)) return;
    modalStack.splice(modalStack.indexOf(modal), 1); modal.remove();
    const top = modalStack.at(-1);
    if (top) top.hidden = false;
    else if (overlay.children.length) { for (const child of overlay.children) child.hidden = false; }
    else overlay.hidden = true;
  };
  modal.__close = close;
  overlay.onclick = (e) => { if (e.target === overlay) modalStack.at(-1)?.__close(); };
  return { modal, close };
}

function md(text) {
  // Conversión Markdown mínima (títulos, listas, negritas, código, tablas) para la maqueta.
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const lines = text.split("\n"); let out = ""; let list = null; let table = [];
  const flushList = () => { if (list) { out += `</${list}>`; list = null; } };
  const flushTable = () => { if (table.length) { out += "<table>" + table.map((row, i) => `<tr>${row.map((c) => `<${i ? "td" : "th"}>${inline(c)}</${i ? "td" : "th"}>`).join("")}</tr>`).join("") + "</table>"; table = []; } };
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^\|/.test(line)) { if (/^\|\s*-/.test(line)) continue; table.push(line.replace(/^\||\|$/g, "").split("|").map((c) => c.trim())); continue; } else flushTable();
    if (/^### /.test(line)) { flushList(); out += `<h3>${inline(line.slice(4))}</h3>`; }
    else if (/^## /.test(line)) { flushList(); out += `<h2>${inline(line.slice(3))}</h2>`; }
    else if (/^- /.test(line)) { if (list !== "ul") { flushList(); out += "<ul>"; list = "ul"; } out += `<li>${inline(line.slice(2))}</li>`; }
    else if (/^\d+\. /.test(line)) { if (list !== "ol") { flushList(); out += "<ol>"; list = "ol"; } out += `<li>${inline(line.replace(/^\d+\. /, ""))}</li>`; }
    else if (line === "") flushList();
    else { flushList(); out += `<p>${inline(line)}</p>`; }
  }
  flushList(); flushTable();
  return h("div", { class: "md", html: out });
}
